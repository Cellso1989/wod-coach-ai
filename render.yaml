services:
  - type: web
    name: wod-coach-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm db:generate &&
      pnpm build
    startCommand: >-
      pnpm --filter @wod-coach-ai/database run migrate:deploy &&
      pnpm --filter @wod-coach-ai/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: AI_DAILY_LIMIT
        value: 3
      - key: AI_DAILY_LIMIT_TIME_ZONE
        value: America/Sao_Paulo
      - key: PASSWORD_RESET_BASE_URL
        value: https://wod-coach-ai.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM
        sync: false
