databases:
  - name: wod-coach-ai-db
    plan: free
    databaseName: wod_coach_ai
    user: wodcoach

services:
  - type: web
    name: wod-coach-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.25.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm db:generate &&
      pnpm build
    startCommand: >-
      pnpm --filter @wod-coach-ai/database run migrate:deploy &&
      pnpm --filter @wod-coach-ai/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wod-coach-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
